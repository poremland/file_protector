name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (e.g. v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Web Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Verify web export
        run: node scripts/verify-web-export.js

      - name: Package web release archive and checksum
        run: |
          tar -czf file-protector-web.tar.gz -C dist .
          sha256sum file-protector-web.tar.gz > file-protector-web.tar.gz.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="$INPUT_TAG"
            if [[ "$RELEASE_TAG" != v* ]]; then
              echo "Release tag must start with 'v' (got: $RELEASE_TAG)" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --generate-notes \
              file-protector-web.tar.gz \
              file-protector-web.tar.gz.sha256
          else
            RELEASE_TAG="${{ github.ref_name }}"
            gh release create "$RELEASE_TAG" \
              --generate-notes \
              file-protector-web.tar.gz \
              file-protector-web.tar.gz.sha256
          fi
